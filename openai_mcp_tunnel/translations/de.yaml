configuration:
  control_plane_tunnel_id:
    name: "OpenAI Tunnel ID"
    description: "Dedicated Secure MCP Tunnel ID, for example tunnel_..."
  control_plane_api_key:
    name: "OpenAI Runtime API key"
    description: "Runtime key for the tunnel client. Do not use an Admin API key."
  mcp_server_url:
    name: "Local MCP server URL"
    description: "Internal Home Assistant App URL for Lexware MCP, including /mcp."
  mcp_auth_token:
    name: "MCP authentication token"
    description: "Must exactly match the local MCP token configured in the Lexware Office MCP App."

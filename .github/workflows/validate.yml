name: Validate Home Assistant Apps

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate shell syntax
        run: |
          sh -n lexware_mcp/run.sh
          sh -n openai_mcp_tunnel/run.sh

      - name: Validate required repository files
        run: |
          test -f repository.yaml
          test -f lexware_mcp/config.yaml
          test -f openai_mcp_tunnel/config.yaml
          test -f LICENSE
          test -f THIRD_PARTY_NOTICES.md

  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: lexware_mcp
            platform: linux/amd64
            arch: amd64
          - app: lexware_mcp
            platform: linux/arm64
            arch: aarch64
          - app: openai_mcp_tunnel
            platform: linux/amd64
            arch: amd64
          - app: openai_mcp_tunnel
            platform: linux/arm64
            arch: aarch64

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.app }} for ${{ matrix.platform }}
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.app }}
          file: ./${{ matrix.app }}/Dockerfile
          platforms: ${{ matrix.platform }}
          push: false
          build-args: |
            BUILD_VERSION=0.1.0
            BUILD_ARCH=${{ matrix.arch }}

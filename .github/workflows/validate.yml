name: Validate Home Assistant Apps

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate shell syntax
        run: |
          sh -n lexware_mcp/run.sh
          sh -n openai_mcp_tunnel/run.sh

      - name: Validate required repository files
        run: |
          test -f repository.yaml
          test -f lexware_mcp/config.yaml
          test -f openai_mcp_tunnel/config.yaml
          test -f LICENSE
          test -f THIRD_PARTY_NOTICES.md

  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: lexware_mcp
            platform: linux/amd64
            arch: amd64
          - app: lexware_mcp
            platform: linux/arm64
            arch: aarch64
          - app: openai_mcp_tunnel
            platform: linux/amd64
            arch: amd64
          - app: openai_mcp_tunnel
            platform: linux/arm64
            arch: aarch64

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.app }} for ${{ matrix.platform }}
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.app }}
          file: ./${{ matrix.app }}/Dockerfile
          platforms: ${{ matrix.platform }}
          push: false
          build-args: |
            BUILD_VERSION=0.1.0
            BUILD_ARCH=${{ matrix.arch }}


  runtime-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build Lexware wrapper image
        run: |
          docker build \
            --build-arg BUILD_VERSION=0.1.0 \
            --build-arg BUILD_ARCH=amd64 \
            -t lexware-ha-smoke ./lexware_mcp

      - name: Start Lexware wrapper read-only with dummy credentials
        run: |
          mkdir -p smoke-data
          cat > smoke-data/options.json <<'JSON'
          {
            "lexware_api_key": "dummy-lexware-key-for-runtime-smoke-test",
            "mcp_auth_token": "0123456789abcdef0123456789abcdef",
            "write_enabled": false,
            "finalize_enabled": false
          }
          JSON
          docker run -d \
            --name lexware-ha-smoke \
            -p 127.0.0.1:18080:8080 \
            -v "$PWD/smoke-data:/data:ro" \
            lexware-ha-smoke

      - name: Verify status endpoint and MCP authentication gate
        run: |
          set -eu
          ok=0
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18080/status >/dev/null; then
              ok=1
              break
            fi
            sleep 1
          done
          test "$ok" = "1"

          code="$(curl -sS -o /tmp/mcp-response.txt -w '%{http_code}' \
            -H 'Content-Type: application/json' \
            -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-11-25","capabilities":{},"clientInfo":{"name":"smoke","version":"1"}}}' \
            http://127.0.0.1:18080/mcp)"
          test "$code" = "401"

      - name: Verify OpenAI tunnel binary exists in wrapper image
        run: |
          docker build \
            --build-arg BUILD_VERSION=0.1.0 \
            --build-arg BUILD_ARCH=amd64 \
            -t openai-tunnel-ha-smoke ./openai_mcp_tunnel
          docker run --rm \
            --entrypoint /usr/bin/tunnel-client \
            openai-tunnel-ha-smoke --version

      - name: Show logs on failure
        if: failure()
        run: docker logs lexware-ha-smoke || true


  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check Lexware MCP production dependencies
        run: |
          git clone https://github.com/marselsel/Lexware-MCP-Server.git upstream
          cd upstream
          git checkout 8da792d08146665036943a9ee7d1b7f444225939
          npm ci --omit=dev
          npm audit --omit=dev --audit-level=critical
